name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurē
        run: cmake -B build
      - name: Kompilē
        run: cmake --build build
      - name: Palaiž testus
        run: ctest --test-dir build --output-on-failure